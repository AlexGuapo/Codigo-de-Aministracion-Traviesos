<svg class="dibujo-sensor dibujo-{{ sensor.estado }}" viewBox="0 0 48 60" aria-hidden="true">
  <rect class="dibujo-cuerpo" x="4" y="6" width="40" height="50" rx="7"/>
  <rect class="dibujo-pantalla" x="10" y="12" width="28" height="18" rx="2"/>
  {% if sensor.estado == "transmitiendo" %}
  <path class="dibujo-onda" d="M15 21h4l2-4 3 8 2-4h7"/>
  {% elif sensor.estado == "fuera_de_operacion" %}
  <path class="dibujo-onda" d="M16 21h16"/>
  {% endif %}
  <path class="dibujo-rejilla" d="M13 37h22M13 42h22M13 47h22"/>
  {% if sensor.estado == "transmitiendo" %}
  <path class="dibujo-senal" d="M30 3a8 8 0 0 1 8 0M27 0a14 14 0 0 1 14 0"/>
  {% endif %}
</svg>
